<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>定时采集配置</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/schedule-tasks/static/styles.css">
</head>
<body>
  <div class="page-shell">
    <header class="hero">
      <div class="hero__eyebrow">MediaCrawler Scheduler</div>
      <h1>每日定时采集配置</h1>
      <p>按平台维护多个作者，统一复用现有 9222 浏览器，串行执行每日 creator 采集任务。</p>
    </header>

    <main class="layout">
      <section class="form-panel">
        <div class="panel-title-row">
          <div>
            <div class="panel-eyebrow">Task Editor</div>
            <h2 id="form-title">新建平台任务</h2>
          </div>
          <button id="reset-form-button" class="button button--ghost" type="button">重置</button>
        </div>

        <form id="task-form" class="task-form">
          <input id="task-id" type="hidden">

          <label class="field">
            <span>任务名称</span>
            <input id="task-name" type="text" placeholder="例如：小红书 AI 作者日采">
          </label>

          <div class="field-grid">
            <label class="field">
              <span>平台</span>
              <select id="task-platform">
                <option value="xhs">小红书</option>
                <option value="dy">抖音</option>
                <option value="bili">Bilibili</option>
                <option value="wb">微博</option>
                <option value="zhihu">知乎</option>
              </select>
            </label>

            <label class="field">
              <span>每日执行时间</span>
              <input id="task-run-time" type="time" value="09:00">
            </label>
          </div>

          <div class="field-grid">
            <label class="field">
              <span>每个作者最大页数</span>
              <input id="task-max-pages" type="number" min="1" value="3">
            </label>

            <label class="field">
              <span>保存方式</span>
              <select id="task-save-option">
                <option value="sqlite">SQLite</option>
                <option value="jsonl">JSONL</option>
                <option value="json">JSON</option>
                <option value="csv">CSV</option>
                <option value="excel">Excel</option>
                <option value="db">MySQL</option>
                <option value="mongodb">MongoDB</option>
              </select>
            </label>
          </div>

          <div class="checkbox-row">
            <label class="checkbox-field">
              <input id="task-enable-comments" type="checkbox">
              <span>抓取评论</span>
            </label>
            <label class="checkbox-field">
              <input id="task-enable-sub-comments" type="checkbox">
              <span>抓取二级评论</span>
            </label>
            <label class="checkbox-field">
              <input id="task-status" type="checkbox" checked>
              <span>任务启用</span>
            </label>
          </div>

          <label class="field">
            <span>作者列表</span>
            <textarea id="task-creators" rows="10" placeholder="每行一个作者。小红书可填完整 creator URL 或 user_id，其余平台按各自 creator_id / URL Token 填写。"></textarea>
          </label>

          <div class="field-hint">
            小红书任务会在每次执行前自动使用 9222 浏览器刷新 <code>xsec_token</code>。所有任务都强制附着 9222 浏览器，不会新开浏览器。
          </div>

          <div id="form-error" class="state state--error hidden"></div>

          <div class="action-row">
            <button class="button button--primary" type="submit">保存任务</button>
          </div>
        </form>
      </section>

      <section class="list-panel">
        <div class="panel-title-row">
          <div>
            <div class="panel-eyebrow">Scheduler Status</div>
            <h2>平台任务列表</h2>
          </div>
          <button id="refresh-button" class="button button--ghost" type="button">刷新</button>
        </div>

        <div id="cdp-status" class="cdp-status">正在检查 9222 浏览器状态...</div>
        <div id="busy-status" class="busy-status hidden"></div>
        <div id="task-list" class="task-list"></div>
        <div id="empty-state" class="state hidden">还没有定时采集任务。</div>

        <section class="history-panel">
          <div class="panel-title-row panel-title-row--compact">
            <div>
              <div class="panel-eyebrow">Run History</div>
              <h3 id="history-title">运行历史</h3>
            </div>
          </div>
          <div id="run-history" class="run-history empty">点击任务卡片查看运行记录。</div>
        </section>
      </section>
    </main>
  </div>

  <script src="/schedule-tasks/static/app.js"></script>
</body>
</html>
