services:
  # MediaCrawler API 核心采集服务 (集成 FastAPI + Node 签名微服务)
  mediacrawler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mediacrawler-app
    restart: unless-stopped
    ports:
      # 宿主机端口可根据实际情况自定义 (默认 8085，避开常见的 8080 冲突)，容器内部保持 8080
      - "${APP_PORT:-8085}:8080"
    environment:
      # 1. 兼容标准连接串 DATABASE_URL，直接连接已有的容器数据库 wenhao-postgres
      DATABASE_URL: postgresql://${POSTGRES_DB_USER:-postgres}:${POSTGRES_DB_PWD:-fuwenhao}@wenhao-postgres:5432/${POSTGRES_DB_NAME:-media_crawler}

      # 2. 独立连接变量（方便程序与脚本精准读取）
      POSTGRES_DB_HOST: wenhao-postgres
      POSTGRES_DB_PORT: 5432
      POSTGRES_DB_USER: ${POSTGRES_DB_USER:-postgres}
      POSTGRES_DB_PWD: ${POSTGRES_DB_PWD:-fuwenhao}
      POSTGRES_DB_NAME: ${POSTGRES_DB_NAME:-media_crawler}
      
      # 3. 存储方式与自动建表配置
      SAVE_DATA_OPTION: postgres
      AUTO_INIT_DB: "true"
      TZ: Asia/Shanghai

      # 4. 调度元数据持久化到挂载目录（容器重建后定时任务不丢）
      SQLITE_DB_PATH: /app/data/sqlite_tables.db

      # 5. Docker 启动后自动写入抖音增长快照定时任务（纯 API，无需 Chrome）
      AUTO_SEED_DY_SCHEDULE: "${AUTO_SEED_DY_SCHEDULE:-true}"
      SCHEDULED_CRAWL_PURE_API: "${SCHEDULED_CRAWL_PURE_API:-true}"
      DY_SCHEDULE_RUN_TIME: "${DY_SCHEDULE_RUN_TIME:-09:00,14:00,22:30}"
      DY_SCHEDULE_MAX_PAGES: "${DY_SCHEDULE_MAX_PAGES:-3}"
      DY_SCHEDULE_SAVE_OPTION: "${DY_SCHEDULE_SAVE_OPTION:-postgres}"
      DY_SCHEDULE_TASK_NAME: "${DY_SCHEDULE_TASK_NAME:-抖音增长快照(自动)}"
      # 逗号分隔 sec_uid；请在 .env 中覆盖为你的账号列表
      DY_SCHEDULE_CREATOR_IDS: "${DY_SCHEDULE_CREATOR_IDS:-MS4wLjABAAAAB92s1iYJ6Kr4B6RpP3zenR2DywmkuBBX-RKYLExuNHk,MS4wLjABAAAAqW8dJX9-mXgmeucLFQW9iPwKz8LHOXBnLzscBfG-YBGLIv_lWbdPa3PUfvl9-6Q5,MS4wLjABAAAA7gvThNYc1JhDB1c-2QHBl5NkHE4kNZVMjVp542IZrqtKDikGAJIQMYIfdHujr1iU}"

    volumes:
      # 挂载宿主机数据与日志目录（防止容器重启数据丢失；含调度 SQLite）
      - ./data:/app/data
      # 挂载本地配置文件（随时在宿主机修改 Cookie，无需重新打镜像）
      - ./.env:/app/.env:ro
      - ./config/base_config.py:/app/config/base_config.py:ro

    # 加入已有公共网络 wenhao-services
    networks:
      - wenhao-services

# 声明引用宿主机已存在的外部 Docker 网络
networks:
  wenhao-services:
    external: true
