services:
  # 抖音采集服务（容器名以 -dy 区分）
  mediacrawler-dy:
    image: mediacrawler:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mediacrawler-dy
    restart: unless-stopped
    ports:
      # 宿主机端口可根据实际情况自定义 (默认 8085，避开常见的 8080 冲突)，容器内部保持 8080
      - "${DY_APP_PORT:-8085}:8080"
    environment:
      # 1. 兼容标准连接串 DATABASE_URL，直接连接已有的容器数据库 wenhao-postgres
      DATABASE_URL: postgresql://${POSTGRES_DB_USER:-postgres}:${POSTGRES_DB_PWD:-fuwenhao}@wenhao-postgres:5432/${POSTGRES_DB_NAME:-media_crawler}

      # 2. 独立连接变量（方便程序与脚本精准读取）
      POSTGRES_DB_HOST: wenhao-postgres
      POSTGRES_DB_PORT: 5432
      POSTGRES_DB_USER: ${POSTGRES_DB_USER:-postgres}
      POSTGRES_DB_PWD: ${POSTGRES_DB_PWD:-fuwenhao}
      POSTGRES_DB_NAME: ${POSTGRES_DB_NAME:-media_crawler}
      
      # 3. 存储方式与自动建表配置
      SAVE_DATA_OPTION: postgres
      AUTO_INIT_DB: "true"
      TZ: Asia/Shanghai
      CRAWLER_PLATFORM: dy
      CRAWLER_COOKIES: "${DY_COOKIES:-}"
      ENABLE_PURE_API_MODE: "true"

      # 4. 调度元数据持久化到挂载目录（容器重建后定时任务不丢）
      SQLITE_DB_PATH: /app/data/sqlite_tables.db
      COOKIE_ADMIN_PASSWORD: "${COOKIE_ADMIN_PASSWORD:-}"

      # 5. Docker 启动后自动写入抖音增长快照定时任务（纯 API，无需 Chrome）
      AUTO_SEED_DY_SCHEDULE: "${AUTO_SEED_DY_SCHEDULE:-true}"
      SCHEDULED_CRAWL_PURE_API: "${SCHEDULED_CRAWL_PURE_API:-true}"
      DY_SCHEDULE_RUN_TIME: "${DY_SCHEDULE_RUN_TIME:-09:00,14:00,22:30}"
      DY_SCHEDULE_MAX_PAGES: "${DY_SCHEDULE_MAX_PAGES:-3}"
      DY_SCHEDULE_SAVE_OPTION: "${DY_SCHEDULE_SAVE_OPTION:-postgres}"
      DY_SCHEDULE_TASK_NAME: "${DY_SCHEDULE_TASK_NAME:-抖音增长快照(自动)}"
      # 可选白名单；留空则自动从 Postgres douyin_creator 读取全部账号
      DY_SCHEDULE_CREATOR_IDS: "${DY_SCHEDULE_CREATOR_IDS:-}"
      DY_SCHEDULE_SYNC_FROM_DB: "${DY_SCHEDULE_SYNC_FROM_DB:-true}"
      AUTO_SEED_BILI_SCHEDULE: "false"
      AUTO_SEED_XHS_SCHEDULE: "false"

    volumes:
      # 挂载宿主机数据与日志目录（防止容器重启数据丢失；含调度 SQLite）
      - ./data/dy:/app/data
      # 挂载本地配置文件（随时在宿主机修改 Cookie，无需重新打镜像）
      - ./.env:/app/.env:ro
      - ./config/base_config.py:/app/config/base_config.py:ro

    # 加入已有公共网络 wenhao-services
    networks:
      - wenhao-services

  # B站采集服务（容器名以 -bili 区分，共用镜像与 PostgreSQL）
  mediacrawler-bili:
    image: mediacrawler:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mediacrawler-bili
    restart: unless-stopped
    ports:
      - "${BILI_APP_PORT:-8086}:8080"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_DB_USER:-postgres}:${POSTGRES_DB_PWD:-fuwenhao}@wenhao-postgres:5432/${POSTGRES_DB_NAME:-media_crawler}
      POSTGRES_DB_HOST: wenhao-postgres
      POSTGRES_DB_PORT: 5432
      POSTGRES_DB_USER: ${POSTGRES_DB_USER:-postgres}
      POSTGRES_DB_PWD: ${POSTGRES_DB_PWD:-fuwenhao}
      POSTGRES_DB_NAME: ${POSTGRES_DB_NAME:-media_crawler}
      SAVE_DATA_OPTION: postgres
      AUTO_INIT_DB: "${AUTO_INIT_DB:-true}"
      TZ: Asia/Shanghai
      SQLITE_DB_PATH: /app/data/sqlite_tables.db
      COOKIE_ADMIN_PASSWORD: "${COOKIE_ADMIN_PASSWORD:-}"
      CRAWLER_PLATFORM: bili
      CRAWLER_COOKIES: "${BILI_COOKIES:-}"
      BILI_CREATOR_IDS: "${BILI_CREATOR_IDS:-}"
      BILI_SPECIFIED_IDS: "${BILI_SPECIFIED_IDS:-}"
      ENABLE_PURE_API_MODE: "true"
      AUTO_SEED_DY_SCHEDULE: "false"
      AUTO_SEED_BILI_SCHEDULE: "${AUTO_SEED_BILI_SCHEDULE:-true}"
      SCHEDULED_CRAWL_PURE_API: "${SCHEDULED_CRAWL_PURE_API:-true}"
      BILI_SCHEDULE_RUN_TIME: "${BILI_SCHEDULE_RUN_TIME:-09:00,14:00,22:30}"
      BILI_SCHEDULE_MAX_PAGES: "${BILI_SCHEDULE_MAX_PAGES:-3}"
      BILI_SCHEDULE_SAVE_OPTION: "${BILI_SCHEDULE_SAVE_OPTION:-postgres}"
      BILI_SCHEDULE_TASK_NAME: "${BILI_SCHEDULE_TASK_NAME:-B站增长快照(自动)}"
      # 可选白名单；留空则自动从 Postgres bilibili_up_info 读取全部 UP 主
      BILI_SCHEDULE_CREATOR_IDS: "${BILI_SCHEDULE_CREATOR_IDS:-}"
      BILI_SCHEDULE_SYNC_FROM_DB: "${BILI_SCHEDULE_SYNC_FROM_DB:-true}"
      AUTO_SEED_XHS_SCHEDULE: "false"
    volumes:
      - ./data/bili:/app/data
      - ./.env:/app/.env:ro
      - ./config/base_config.py:/app/config/base_config.py:ro
    networks:
      - wenhao-services

  # 小红书采集服务（容器名以 -xhs 区分；纯 HTTP API，无 Chromium）
  mediacrawler-xhs:
    image: mediacrawler-xhs:latest
    build:
      context: .
      dockerfile: Dockerfile.xhs
    container_name: mediacrawler-xhs
    restart: unless-stopped
    ports:
      - "${XHS_APP_PORT:-8087}:8080"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_DB_USER:-postgres}:${POSTGRES_DB_PWD:-fuwenhao}@wenhao-postgres:5432/${POSTGRES_DB_NAME:-media_crawler}
      POSTGRES_DB_HOST: wenhao-postgres
      POSTGRES_DB_PORT: 5432
      POSTGRES_DB_USER: ${POSTGRES_DB_USER:-postgres}
      POSTGRES_DB_PWD: ${POSTGRES_DB_PWD:-fuwenhao}
      POSTGRES_DB_NAME: ${POSTGRES_DB_NAME:-media_crawler}
      SAVE_DATA_OPTION: postgres
      AUTO_INIT_DB: "true"
      TZ: Asia/Shanghai
      SQLITE_DB_PATH: /app/data/sqlite_tables.db
      COOKIE_ADMIN_PASSWORD: "${COOKIE_ADMIN_PASSWORD:-}"
      CRAWLER_PLATFORM: xhs
      CRAWLER_COOKIES: "${XHS_COOKIES:-}"
      XHS_COOKIES: "${XHS_COOKIES:-}"
      XHS_COOKIES_FILE: "${XHS_COOKIES_FILE:-/run/secrets/xhs_cookies}"
      XHS_COOKIES_RUNTIME_FILE: "${XHS_COOKIES_RUNTIME_FILE:-/app/data/xhs_cookies}"
      XHS_CREATOR_IDS: "${XHS_CREATOR_IDS:-}"
      CRAWLER_LOGIN_TYPE: cookie
      ENABLE_PURE_API_MODE: "true"
      XHS_SAFE_MODE: "true"
      XHS_MAX_PAGES: "1"
      XHS_MAX_CREATORS_PER_RUN: "1"
      XHS_REQUEST_INTERVAL_MIN_SEC: "8"
      XHS_REQUEST_INTERVAL_MAX_SEC: "15"
      XHS_API_REQUEST_INTERVAL_MIN_SEC: "2"
      XHS_API_REQUEST_INTERVAL_MAX_SEC: "4"
      XHS_API_ADD_SOFT_TIMEOUT_SEC: "50"
      AUTO_SEED_DY_SCHEDULE: "false"
      AUTO_SEED_BILI_SCHEDULE: "false"
      AUTO_SEED_XHS_SCHEDULE: "${AUTO_SEED_XHS_SCHEDULE:-true}"
      SCHEDULED_CRAWL_PURE_API: "${SCHEDULED_CRAWL_PURE_API:-true}"
      XHS_SCHEDULE_RUN_TIME: "${XHS_SCHEDULE_RUN_TIME:-10:30}"
      XHS_SCHEDULE_TASK_NAME: "${XHS_SCHEDULE_TASK_NAME:-小红书每日安全快照(自动)}"
      XHS_SCHEDULE_SYNC_FROM_DB: "${XHS_SCHEDULE_SYNC_FROM_DB:-true}"
    volumes:
      - ./data/xhs:/app/data
      - ./.env:/app/.env:ro
      - ./config/base_config.py:/app/config/base_config.py:ro
      # Rotate xhs_cookies atomically on the host; the app re-reads it per request.
      # Set-Cookie refreshes are written to ./data/xhs/xhs_cookies (runtime cache).
      - ${XHS_SECRET_DIR_HOST:-./secrets}:/run/secrets:ro
    networks:
      - wenhao-services

  # 公众号采集服务（weread-omni CLI；宿主机端口 8088）
  mediacrawler-gzh:
    image: mediacrawler-gzh:latest
    build:
      context: .
      dockerfile: Dockerfile.gzh
    container_name: mediacrawler-gzh
    restart: unless-stopped
    ports:
      - "${GZH_APP_PORT:-8088}:8080"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_DB_USER:-postgres}:${POSTGRES_DB_PWD:-fuwenhao}@wenhao-postgres:5432/${POSTGRES_DB_NAME:-media_crawler}
      POSTGRES_DB_HOST: wenhao-postgres
      POSTGRES_DB_PORT: 5432
      POSTGRES_DB_USER: ${POSTGRES_DB_USER:-postgres}
      POSTGRES_DB_PWD: ${POSTGRES_DB_PWD:-fuwenhao}
      POSTGRES_DB_NAME: ${POSTGRES_DB_NAME:-media_crawler}
      SAVE_DATA_OPTION: postgres
      AUTO_INIT_DB: "true"
      TZ: Asia/Shanghai
      SQLITE_DB_PATH: /app/data/sqlite_tables.db
      COOKIE_ADMIN_PASSWORD: "${COOKIE_ADMIN_PASSWORD:-}"
      CRAWLER_PLATFORM: gzh
      CRAWLER_TYPE: creator
      ENABLE_PURE_API_MODE: "true"
      WEREAD_OMNI_CLI: "${WEREAD_OMNI_CLI:-/opt/weread-omni/bin/weread-omni.js}"
      WEREAD_WEB_COOKIE_FILE: "${WEREAD_WEB_COOKIE_FILE:-/run/secrets/weread_web_cookie}"
      WEREAD_WEB_COOKIE: "${WEREAD_WEB_COOKIE:-}"
      GZH_WEB_COOKIE: "${GZH_WEB_COOKIE:-}"
      GZH_ACCOUNT_IDS: "${GZH_ACCOUNT_IDS:-}"
      GZH_STATS_LIMIT: "${GZH_STATS_LIMIT:-20}"
      GZH_ARTICLES_COUNT: "${GZH_ARTICLES_COUNT:-20}"
      WEREAD_CONFIG_DIR: "${WEREAD_CONFIG_DIR:-/root/.config/weread}"
      AUTO_SEED_DY_SCHEDULE: "false"
      AUTO_SEED_BILI_SCHEDULE: "false"
      AUTO_SEED_XHS_SCHEDULE: "false"
      AUTO_SEED_GZH_SCHEDULE: "${AUTO_SEED_GZH_SCHEDULE:-true}"
      SCHEDULED_CRAWL_PURE_API: "${SCHEDULED_CRAWL_PURE_API:-true}"
      GZH_SCHEDULE_RUN_TIME: "${GZH_SCHEDULE_RUN_TIME:-11:00}"
      GZH_SCHEDULE_TASK_NAME: "${GZH_SCHEDULE_TASK_NAME:-公众号每日阅读量快照(自动)}"
      GZH_SCHEDULE_SYNC_FROM_DB: "${GZH_SCHEDULE_SYNC_FROM_DB:-true}"
    volumes:
      - ./data/gzh:/app/data
      - ./.env:/app/.env:ro
      - ./config/base_config.py:/app/config/base_config.py:ro
      # Host-built weread-omni (npm ci && npm run build)
      - ${WEREAD_OMNI_HOST_PATH:-/opt/weread-omni}:/opt/weread-omni:ro
      # Rotate weread_web_cookie atomically on the host; the app re-reads it per stats request.
      - ${WEREAD_SECRET_DIR_HOST:-./secrets}:/run/secrets:ro
      # Persist WeRead mobile login session (login once on host or via docker exec)
      - ${WEREAD_CONFIG_HOST_PATH:-./data/weread-config}:/root/.config/weread
    networks:
      - wenhao-services

# 声明引用宿主机已存在的外部 Docker 网络
networks:
  wenhao-services:
    external: true
